<aside class="chooser" aria-label="Hazard">
  <header class="chooser__header">
    <span class="c-label">Hazard</span>
    <button class="c-icon-button" type="button" (click)="closed.emit()">
      <cal-icon name="close" [size]="14" label="Close hazard selection" />
    </button>
  </header>

  <div class="chooser__body">
    <p class="chooser__lede">Each hazard carries its own record, sources and tools.</p>

    <ul class="chooser__options">
      @for (option of options; track option.mode) {
        <li>
          <button
            class="hazard-option"
            type="button"
            [attr.aria-pressed]="selected() === option.mode"
            (click)="chosen.emit(option.mode)"
          >
            <cal-icon [name]="option.icon" [size]="20" />
            <span class="hazard-option__body">
              <span class="hazard-option__label">{{ option.label }}</span>
              <span class="hazard-option__summary">{{ option.summary }}</span>
              <span class="hazard-option__coverage">{{ option.coverage }}</span>
            </span>
            @if (selected() === option.mode) {
              <cal-icon name="locate" [size]="14" label="Currently shown" />
            } @else {
              <cal-icon name="chevron-right" [size]="14" />
            }
          </button>
        </li>
      }
    </ul>

    <!-- Stated where a reader is choosing what to look at, which is the moment they are most likely
         to expect a warning service. This is not one. -->
    <p class="chooser__note">
      A historical and research archive. Official warnings come from PHIVOLCS, PAGASA and NDRRMC.
    </p>
  </div>
</aside>
